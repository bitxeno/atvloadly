name: "🚀 Release"

# on events
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# jobs
jobs:
  build:
    name: Generate cross-platform builds
    permissions:
      contents: write
    strategy:
      matrix:
        go_version: [1.25.x]
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{steps.vars.outputs.VERSION}}
      BUILDDATE: ${{steps.vars.outputs.BUILDDATE}}
      COMMIT: ${{steps.vars.outputs.COMMIT}}
      APP_NAME: ${{steps.vars.outputs.APP_NAME}}
      PUSH_DOCKERHUB: ${{steps.vars.outputs.PUSH_DOCKERHUB}}
      CHANGELOG: ${{steps.changelog.outputs.changelog}}
    steps:
      # step 1: checkout repository code
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # step 2: setup build envirement
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # step 3: set workflow variables
      - id: metadata
        uses: ahmadnassri/action-metadata@v2
      - name: Initialize workflow environments variables
        id: vars
        run: |
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "BUILDDATE=$(date '+%F-%T')" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --verify HEAD)" >> $GITHUB_OUTPUT
          echo "APP_NAME=${{ steps.metadata.outputs.repository_name }}" >> $GITHUB_OUTPUT
          echo "REPO=$(echo 'github.com/${{ github.repository }}')" >> $GITHUB_OUTPUT
          echo "BRANCH=${{ steps.metadata.outputs.repository_default_branch }}" >> $GITHUB_OUTPUT

          if [ ! -z $DOCKER_TOKEN ]; then echo "PUSH_DOCKERHUB=1" >> $GITHUB_OUTPUT; fi
        env:
          DOCKER_TOKEN: "${{ secrets.DOCKER_TOKEN }}"

      # step 4: generate build files
      - name: build frontend
        run: cd ./web/static && npm install && npm run build
      - name: Generate build files
        uses: crazy-max/ghaction-xgo@v4
        env:
          CGO_ENABLED: "0"
        with:
          xgo_version: latest
          go_version: ${{ matrix.go_version }}
          dest: build
          prefix: ${{steps.vars.outputs.APP_NAME}}
          targets: linux/amd64,linux/arm64
          v: true
          x: false
          ldflags: -w -s -X ${{steps.vars.outputs.REPO}}/internal/app/build.Version=${{steps.vars.outputs.VERSION}} -X ${{steps.vars.outputs.REPO}}/internal/app/build.BuildDate=${{steps.vars.outputs.BUILDDATE}} -X ${{steps.vars.outputs.REPO}}/internal/app/build.Commit=${{steps.vars.outputs.COMMIT}} -X ${{steps.vars.outputs.REPO}}/internal/app/build.Mode=production

      # step 5: Upload binary to artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.vars.outputs.APP_NAME}}
          path: build
          retention-days: 1

      # step 6: Generate Changelog
      - name: Generate Changelog
        id: changelog
        uses: bitxeno/changelogithub-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Any hyphen is a prerelease, matching the Docker latest guard.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # output-file: ./docs/CHANGELOG.md
          types: |
            feat
            fix
            perf
            refactor
            chore
          #   docs
          #   build
          #   test
          #   style
          #   ci

  # The desktop app in desktop/app. The whole dependency tree is pure Go
  # (lzfse decodes through bitxeno/lzfse-go), so any runner compiles every
  # platform without cgo — except code signing and the DMG, which need macOS:
  # the darwin target builds on macos-latest (unsigned Go binaries are killed
  # by Apple silicon kernels, and hdiutil only exists there), Windows builds
  # on ubuntu-latest (mygo downloads NSIS itself).
  desktop:
    name: Build desktop apps
    needs: [build]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos
            platforms: darwin/universal
            # mygo leaves the .app beside the DMG; the DMG already holds it.
            installers: desktop/app/build/darwin-universal
            pattern: '*.dmg'
          - os: ubuntu-latest
            target: windows
            platforms: windows/amd64,windows/arm64
            # mygo leaves atvloadly.exe and its resources beside each Setup;
            # the Setup already holds them.
            installers: desktop/app/build
            pattern: '*Setup*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build frontend
        run: cd web/static && npm install && npm run build

      # plumesign binaries are gitignored (desktop/app/resources/*/bin/);
      # fetch them so the app bundles its signing engine.
      - name: Fetch plumesign
        run: desktop/scripts/fetch-plumesign.sh

      # mygo makes the Windows installer with NSIS and only warns when it is
      # missing (it downloads NSIS itself on Windows, not on Linux).
      - name: Install NSIS
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Build desktop apps
        working-directory: desktop/app
        env:
          VERSION: ${{ needs.build.outputs.VERSION }}
          COMMIT: ${{ needs.build.outputs.COMMIT }}
          BUILDDATE: ${{ needs.build.outputs.BUILDDATE }}
          # Sign and notarize on macOS when the secrets are configured;
          # unsigned/ad-hoc otherwise.
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          npm install
          npm run build:release -- -platform=${{ matrix.platforms }}

      # Ship only the installers: mygo also leaves the unpackaged app next
      # to them, which the installer already contains. Copy them outside
      # build/, so the copy cannot be picked up by the search below.
      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p desktop/app/installers
          # -exec cp keeps names with spaces (the DMG has one) intact.
          find ${{ matrix.installers }} -maxdepth 2 -type f -name '${{ matrix.pattern }}' \
            -exec cp {} desktop/app/installers/ \;
          ls -la desktop/app/installers/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-apps-${{ matrix.target }}
          path: desktop/app/installers/
          retention-days: 1

  dockerhub:
    name: Push to DockerHub
    if: ${{needs.build.outputs.PUSH_DOCKERHUB}}
    needs: [build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{needs.build.outputs.APP_NAME}}
          path: build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}
          # latest follows stable releases only, beta follows prereleases:
          # a v0.8.0-beta.1 tag pushes v0.8.0-beta.1 and beta, never latest.
          # flavor latest=false turns off the implicit latest that
          # type=ref,event=tag would add for any tag.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
          flavor: |
            latest=false
      - name: Build and push Docker images to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{needs.build.outputs.APP_NAME}}
            VERSION=${{needs.build.outputs.VERSION}}
            BUILDDATE=${{needs.build.outputs.BUILDDATE}}
            COMMIT=${{needs.build.outputs.COMMIT}}

  ghcr:
    name: Push to GitHub Container Registry
    needs: [build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{needs.build.outputs.APP_NAME}}
          path: build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Same rule as DockerHub: latest for stable tags, beta otherwise.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
          flavor: |
            latest=false
      - name: Build and push Docker images to ghci
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{needs.build.outputs.APP_NAME}}
            VERSION=${{needs.build.outputs.VERSION}}
            BUILDDATE=${{needs.build.outputs.BUILDDATE}}
            COMMIT=${{needs.build.outputs.COMMIT}}

  # One release holding the server tarballs, the macOS DMG and the Windows
  # installers. The macOS DMG is also pushed as a Homebrew cask to the
  # bitxeno/homebrew-tap repo (secrets HOMEBREW_TAP_TOKEN with contents:write
  # on that repo); the cask strips the quarantine xattr post-install and fixes
  # the bundled plumesign's exec bit, so `brew install --cask
  # bitxeno/tap/atvloadly` works without Gatekeeper friction.
  release:
    name: Publish release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download server artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.APP_NAME }}
          path: build

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-apps-macos
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-apps-windows
          path: dist

      # Derives the version and the Homebrew channel once: a tag with a hyphen
      # is a prerelease and publishes atvloadly@beta, anything else atvloadly.
      # The install note and the cask generation both read these.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            CASK_TOKEN="atvloadly@beta"
          else
            CASK_TOKEN="atvloadly"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CASK_TOKEN=$CASK_TOKEN" >> "$GITHUB_OUTPUT"
          echo "CASK_FILE=$CASK_TOKEN.rb" >> "$GITHUB_OUTPUT"
          echo "CASK_REF=bitxeno/tap/$CASK_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Compress server builds
        run: cd ./build && for i in *; do tar -czf $i.tar.gz $i; done && cd ..

      # mygo names the artifacts with spaces: "atvloadly <version>.dmg" and
      # "atvloadly Setup <version> <arch>.exe". Rename them to a dash form, so
      # the download name needs no quoting, and the cask references the DMG
      # under the name it checksums.
      - name: Normalize desktop artifact names
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG="$(find dist -name "atvloadly $VERSION.dmg" | head -1)"
          if [ -z "$DMG" ]; then
            echo "DMG 'atvloadly $VERSION.dmg' not found in dist:" >&2
            find dist -type f >&2
            exit 1
          fi
          mv "$DMG" "dist/atvloadly-$VERSION.dmg"

          # Each "atvloadly Setup <version> <arch>.exe" becomes
          # "atvloadly-<version>-<arch>-setup.exe". -print0 keeps names with
          # spaces intact through the loop.
          find dist -maxdepth 1 -type f -name 'atvloadly Setup *.exe' -print0 |
            while IFS= read -r -d '' setup; do
              name="$(basename "$setup")"
              arch="${name#atvloadly Setup "$VERSION" }"
              arch="${arch%.exe}"
              mv "$setup" "dist/atvloadly-$VERSION-$arch-setup.exe"
            done
          ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./build/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe
          # Any hyphen is a prerelease, matching the Docker latest guard.
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: "${{ github.ref_name }} - tvOS 17.4+"
          body: ${{ needs.build.outputs.CHANGELOG }}
          draft: true
          fail_on_unmatched_files: true

      # The action puts `body` before the generated notes, so append the
      # macOS install note in a second pass to land it at the very end. The
      # brew line comes first, then the DMG fallback: the DMG is unsigned
      # (ad hoc), hence the quarantine step.
      - name: Append macOS install note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # -R, because this job never checks the repository out: gh has no
          # other way to know which repository the release lives in.
          note="$(printf '\n\n> **macOS install**\n>\n> Homebrew: `brew install --cask %s`\n>\n> Or download the DMG, drag `atvloadly.app` into Applications, then run once:\n> `sudo xattr -dr com.apple.quarantine /Applications/atvloadly.app`' "${{ steps.version.outputs.CASK_REF }}")"
          body="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json body -q .body)"
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes "${body}${note}"

      # Cask generation needs the DMG's final checksum, so it runs after the
      # release step. The DMG upload already happened above; only the cask
      # file itself is uploaded here.
      #
      # The cask follows the release channel the way Homebrew names them: a
      # stable tag updates the "atvloadly" cask, a -beta tag updates the
      # "atvloadly@beta" cask and leaves the stable one alone.
      - name: Generate Homebrew cask
        id: cask
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG="dist/atvloadly-$VERSION.dmg"
          [ -f "$DMG" ] || { echo "missing $DMG" >&2; exit 1; }
          SHA=$(sha256sum "$DMG" | awk '{print $1}')
          echo "DMG_SHA256=$SHA" >> "$GITHUB_OUTPUT"

          TOKEN="${{ steps.version.outputs.CASK_TOKEN }}"

          # Indentation and the ENV.fetch style follow `brew style --fix`
          # output so the tap repo's cop does not push back (the dshdock
          # cask was validated this way).
          cat > "$TOKEN.rb" <<RUBY
          # typed: strict
          # frozen_string_literal: true

          cask "$TOKEN" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/atvloadly-$VERSION.dmg"
            name "atvloadly"
            desc "Sideload apps onto Apple TV devices"
            homepage "https://github.com/$GITHUB_REPOSITORY"

            depends_on :macos

            app "atvloadly.app"

            # The build is not notarized (ad-hoc signing): strip quarantine
            # right after install to avoid the first-launch Gatekeeper block,
            # and restore the exec bit on the bundled plumesign engine under
            # Resources/bin. Users downloading the DMG directly do not go
            # through this path; caveats keeps the manual instructions.
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/atvloadly.app"]
              set_permissions "{{appdir}}/atvloadly.app/Contents/Resources/bin/plumesign", "0755"
            end

            caveats <<~EOS
              The build is not notarized (ad-hoc signing). If Gatekeeper
              blocks the first launch: right-click the app and choose Open,
              or run
                xattr -dr com.apple.quarantine /Applications/atvloadly.app
            EOS
          end
          RUBY
          ruby -c "$TOKEN.rb"

      - name: Upload cask to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.version.outputs.CASK_FILE }}" -R "$GITHUB_REPOSITORY" --clobber

      - name: Push cask to Homebrew tap
        env:
          TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          CASK_FILE: ${{ steps.version.outputs.CASK_FILE }}
        # Skip gracefully when the secrets are not configured: the cask is
        # attached to the Release assets and can be copied into the tap
        # manually.
        if: env.TAP_REPO != '' && env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          # Use the Contents API instead of git push: git credentials are
          # picky about OAuth token formats, while the API's Bearer auth
          # plus printing the raw response on failure stays diagnosable.
          API="https://api.github.com/repos/${TAP_REPO}/contents/Casks/${CASK_FILE}"
          OLD_SHA=$(curl -sf -H "Authorization: Bearer ${TAP_TOKEN}" "$API" | jq -r '.sha // empty') || true
          jq -n --arg message "atvloadly ${VERSION}" \
                --arg content "$(base64 -w0 "${CASK_FILE}")" \
                --arg sha "$OLD_SHA" \
                '{message: $message, content: $content}
                 + (if $sha == "" then {} else {sha: $sha} end)' > payload.json
          HTTP=$(curl -s -o response.json -w "%{http_code}" \
            -X PUT -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API" -d @payload.json)
          echo "tap update HTTP ${HTTP}"
          cat response.json | jq -r '.commit.html_url // .message'
          case "$HTTP" in 200|201) exit 0;; *) exit 1;; esac

  clean:
    name: Delete temp artifacts
    # Wait for the release job too: it downloads the same artifacts, and
    # deleting them early would race it. Ignore a skipped dockerhub job.
    if: always() && (needs.dockerhub.result == 'success' || needs.dockerhub.result == 'skipped') && (needs.ghcr.result == 'success')
    needs: [build, desktop, dockerhub, ghcr, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            ${{ needs.build.outputs.APP_NAME }}
            desktop-apps-macos
            desktop-apps-windows
          failOnError: false
