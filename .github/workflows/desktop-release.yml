name: "🖥️ Desktop Release"

# Desktop builds of the mygo app in desktop/app, published with the server
# release. The whole dependency tree is pure Go (lzfse decodes through
# bitxeno/lzfse-go), so any runner compiles every platform without cgo.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build frontend
        run: cd web/static && npm install && npm run build

      - name: Build desktop apps
        working-directory: desktop/app
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILDDATE: ${{ github.event.head_commit.timestamp }}
          # Sign and notarize on macOS when the secrets are configured;
          # unsigned/ad-hoc otherwise.
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          npm install
          npm run build:release -- -platform darwin/universal,windows/amd64,windows/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-apps
          path: desktop/app/build/
          retention-days: 1

  release:
    name: Publish desktop release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-apps
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: atvloadly Desktop ${{ github.ref_name }}
          files: |
            dist/**/*
          generate_release_notes: true
          draft: true
