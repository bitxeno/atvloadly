name: "🚀 Release Nightly"

# on events
on:
  schedule:
    - cron: '0 0 * * *' # runs daily at 00:00
  workflow_dispatch:
  # push:
  #   branches: [main, master, release/v*, tvos17]

# jobs
jobs:
  check:
    name: Check has new commits today
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      require_build: ${{steps.commit_check.outputs.require_build}}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check for new commits
        id: commit_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "require_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(git log --oneline --since '24 hours ago' | wc -l | xargs)" -gt 0 ]; then
              echo "require_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "require_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "require_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Generate cross-platform builds
    if: ${{needs.check.outputs.require_build == 'true'}}
    needs: [check]
    permissions:
      contents: write
    strategy:
      matrix:
        go_version: [1.25.x]
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{steps.vars.outputs.VERSION}}
      BUILDDATE: ${{steps.vars.outputs.BUILDDATE}}
      COMMIT: ${{steps.vars.outputs.COMMIT}}
      APP_NAME: ${{steps.vars.outputs.APP_NAME}}
      PUSH_DOCKERHUB: ${{steps.vars.outputs.PUSH_DOCKERHUB}}
    steps:
      # step 1: checkout repository code
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # step 2: setup build envirement
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # step 3: set workflow variables
      - id: metadata
        uses: ahmadnassri/action-metadata@v2
      - name: Initialize workflow environments variables
        id: vars
        run: |
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "BUILDDATE=$(date '+%F-%T')" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --verify HEAD)" >> $GITHUB_OUTPUT
          echo "APP_NAME=${{ steps.metadata.outputs.repository_name }}" >> $GITHUB_OUTPUT
          echo "REPO=$(echo 'github.com/${{ github.repository }}')" >> $GITHUB_OUTPUT
          echo "BRANCH=${{ steps.metadata.outputs.repository_default_branch }}" >> $GITHUB_OUTPUT

          if [ ! -z $DOCKER_TOKEN ]; then echo "PUSH_DOCKERHUB=1" >> $GITHUB_OUTPUT; fi
        env:
          DOCKER_TOKEN: "${{ secrets.DOCKER_TOKEN }}"

      # step 4: generate build files
      - name: build frontend
        run: cd ./web/static && npm install && npm run build
      - name: Generate build files
        uses: crazy-max/ghaction-xgo@v4
        env:
          CGO_ENABLED: "0"
        with:
          xgo_version: latest
          go_version: ${{ matrix.go_version }}
          dest: build
          prefix: ${{steps.vars.outputs.APP_NAME}}
          targets: linux/amd64,linux/arm64
          v: true
          x: false
          ldflags: -w -s -X ${{steps.vars.outputs.REPO}}/internal/app/build.Version=${{steps.vars.outputs.VERSION}} -X ${{steps.vars.outputs.REPO}}/internal/app/build.BuildDate=${{steps.vars.outputs.BUILDDATE}} -X ${{steps.vars.outputs.REPO}}/internal/app/build.Commit=${{steps.vars.outputs.COMMIT}} -X ${{steps.vars.outputs.REPO}}/internal/app/build.Mode=production

      # step 5: Upload binary to artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.vars.outputs.APP_NAME}}
          path: build
          retention-days: 1

  # Desktop builds run nightly for smoke coverage only: they land in the run's
  # artifacts and are never published to a Release. Code signing and the DMG
  # need macOS (unsigned Go binaries are killed by Apple silicon kernels, and
  # hdiutil only exists there); Windows builds on ubuntu-latest, where mygo
  # downloads NSIS itself.
  desktop:
    name: Build desktop apps
    if: ${{needs.check.outputs.require_build == 'true'}}
    needs: [check]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos
            platforms: darwin/universal
            # mygo leaves the .app beside the DMG; the DMG already holds it.
            installers: desktop/app/build/darwin-universal
            pattern: '*.dmg'
          - os: ubuntu-latest
            target: windows
            platforms: windows/amd64,windows/arm64
            # mygo leaves atvloadly.exe and its resources beside each Setup;
            # the Setup already holds them.
            installers: desktop/app/build
            pattern: '*Setup*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build frontend
        run: cd web/static && npm install && npm run build

      # plumesign binaries are gitignored (desktop/app/resources/*/bin/);
      # fetch them so the app bundles its signing engine.
      - name: Fetch plumesign
        run: desktop/scripts/fetch-plumesign.sh

      # mygo makes the Windows installer with NSIS and only warns when it is
      # missing (it downloads NSIS itself on Windows, not on Linux).
      - name: Install NSIS
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Build desktop apps
        working-directory: desktop/app
        env:
          # Nightly builds are artifacts only: a placeholder version keeps the
          # bundle and DMG names unique per run, and no signing secrets are
          # passed so the app stays ad hoc signed. build.mjs fills BUILDDATE
          # with the current time when it is unset.
          VERSION: 0.0.0-nightly.${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          npm install
          npm run build:release -- -platform=${{ matrix.platforms }}

      # Ship only the installers: mygo also leaves the unpackaged app next
      # to them, which the installer already contains. Copy them outside
      # build/, so the copy cannot be picked up by the search below.
      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p desktop/app/installers
          # -exec cp keeps names with spaces (the DMG has one) intact.
          find ${{ matrix.installers }} -maxdepth 2 -type f -name '${{ matrix.pattern }}' \
            -exec cp {} desktop/app/installers/ \;
          ls -la desktop/app/installers/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-apps-${{ matrix.target }}
          path: desktop/app/installers/
          retention-days: 3

  dockerhub:
    name: Push to DockerHub
    if: ${{needs.build.outputs.PUSH_DOCKERHUB}}
    needs: [build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{needs.build.outputs.APP_NAME}}
          path: build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=raw,value=test
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Build and push Docker images to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{needs.build.outputs.APP_NAME}}
            VERSION=${{needs.build.outputs.VERSION}}
            BUILDDATE=${{needs.build.outputs.BUILDDATE}}
            COMMIT=${{needs.build.outputs.COMMIT}}

  ghcr:
    name: Push to GitHub Container Registry
    needs: [build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{needs.build.outputs.APP_NAME}}
          path: build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=test
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Build and push Docker images to ghci
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{needs.build.outputs.APP_NAME}}
            VERSION=${{needs.build.outputs.VERSION}}
            BUILDDATE=${{needs.build.outputs.BUILDDATE}}
            COMMIT=${{needs.build.outputs.COMMIT}}
